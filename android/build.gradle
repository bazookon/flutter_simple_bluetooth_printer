// Migrated to Built-in Kotlin (Flutter 3.27+): el host (Flutter) inyecta
// org.jetbrains.kotlin.android centralmente, así que no declaramos ni
// classpath de KGP ni `apply plugin: 'kotlin-android'` acá.
// El bloque plugins{} debe ser el primer statement del script — group y
// version van después.
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group = "com.xiao.flutter_simple_bluetooth_printer"
version = "1.0-SNAPSHOT"

android {
    namespace = "com.xiao.flutter_simple_bluetooth_printer"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }
}

dependencies {
    implementation "com.polidea.rxandroidble3:rxandroidble:1.17.2"
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
}
