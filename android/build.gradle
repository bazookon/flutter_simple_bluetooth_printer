// Built-in Kotlin (Flutter 3.44+): el host aplica org.jetbrains.kotlin.android
// automáticamente, NO declaramos el id ni `apply plugin` acá. Tampoco va
// `kotlinOptions` adentro del bloque android — se reemplaza por un bloque
// kotlin {} top-level con compilerOptions.
plugins {
    id "com.android.library"
}

group = "com.xiao.flutter_simple_bluetooth_printer"
version = "1.0-SNAPSHOT"

android {
    namespace = "com.xiao.flutter_simple_bluetooth_printer"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    implementation "com.polidea.rxandroidble3:rxandroidble:1.17.2"
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
}
